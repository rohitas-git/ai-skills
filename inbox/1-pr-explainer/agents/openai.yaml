interface:
  display_name: "PR Explainer"
  short_description: "Explain PR changes, their reasons, and why to keep them"
  default_prompt: "Use $1-pr-explainer to explain this PR in simple English, with feature groups, before-and-after behavior, why each change was made, and what would be lost or could break if it were undone. Distinguish stated reasons, inference, and unknowns."
policy:
  allow_implicit_invocation: false
